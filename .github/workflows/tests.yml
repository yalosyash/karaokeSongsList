name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: User scenarios (Chrome)
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      TEST_ARTIFACT_DIR: tests/artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build catalog
        run: npm run build
      - name: Install pinned Chrome
        run: npm run test:browser
      - name: Run user scenarios
        run: npm test
      - name: Verify tests detect intentional defects
        run: npm run test:mutations
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: tests/artifacts
          if-no-files-found: ignore
