name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: User scenarios (Chrome)
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build catalog
        run: npm run build
      - name: Run user scenarios
        run: npm test
